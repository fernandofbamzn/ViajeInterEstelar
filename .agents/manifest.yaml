editorial:
  name: "EditorIAl IOREB"
  version: "0.1.0"
  language: "es-ES"

active_project:
  id: "bitacora_centauri"
  title: "Bitácora Centauri"
  genre: "hard_scifi_contemplativa"

precedence:
  - user_request
  - safety
  - novel
  - genre
  - editorial

models:
  recommended_roles:
    writer: "Claude Opus"
    editor: "GPT-5.5 or GPT-4o"
    critic: "GPT-5.5 or Claude Opus"
    orchestrator: "Gemini 3.5 Flash"
    producer: "Local Script / Cheap Model"

paths:
  manuscript: "manuscrito/"
  bible: "biblia/"
  plot: "trama/"
  characters: "biblia/personajes/"
  world: "biblia/mundo/"
  technology: "biblia/tecnologia/"
  export: "exportacion/"
  translations: "traducciones/"
  costs: "costes/"
  agents: ".agents/"

novel_structure:
  required_paths:
    - "manuscrito/"
    - "trama/"
    - "trama/premisas/"
    - "trama/escaletas/"
    - "biblia/"
    - "biblia/personajes/"
    - "biblia/mundo/"
    - "biblia/tecnologia/"
    - "exportacion/"
    - "exportacion/es/"
  required_indexes:
    - "trama/README.md"
    - "biblia/personajes/README.md"
    - "biblia/mundo/README.md"
    - "biblia/tecnologia/README.md"

translation:
  enabled: true
  default_source_language: "es"
  supported_target_languages:
    - "en"
    - "fr"
    - "de"
    - "it"
    - "pt"
  default_status: "native_review_pending"
  paths:
    translations: "traducciones/"
    localized_exports: "exportacion/"
  workflows:
    translation: ".agents/editorial/workflows/wf_editorial_09_traduccion_multilingue.md"
    localization_publication: ".agents/editorial/workflows/wf_editorial_10_localizacion_publicacion.md"
    translation_audit: ".agents/editorial/workflows/wf_editorial_11_auditoria_traduccion.md"

